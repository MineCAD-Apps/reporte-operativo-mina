<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#102b48" />
  <title>Planos Mina</title>
  <style>
    :root {
      --bg: #edf3f8;
      --surface: #ffffff;
      --surface-soft: #f5f9fc;
      --text: #18334e;
      --muted: #62768a;
      --line: #d8e5ef;
      --dark: #102b48;
      --accent: #3375c2;
      --accent-dark: #245e92;
      --radius: 14px;
      --shadow: 0 7px 22px rgba(21, 32, 40, .07);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .topbar {
      background: var(--dark);
      color: white;
      padding: 20px clamp(16px, 4vw, 44px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,.15);
    }

    .eyebrow {
      margin: 0;
      text-transform: uppercase;
      letter-spacing: .12em;
      font-size: 11px;
      color: var(--muted);
      font-weight: 800;
    }

    .topbar .eyebrow { color: #93b4d0; }

    h1 {
      margin: 2px 0 0;
      font-size: clamp(24px, 4vw, 34px);
    }

    .back-link {
      color: white;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 9px;
      padding: 8px 12px;
      font-size: 13px;
      white-space: nowrap;
    }

    main {
      width: min(1180px, calc(100% - 24px));
      margin: 22px auto 60px;
    }

    .mine-selector {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 16px;
    }

    .mine-selector h2 {
      margin: 4px 0 14px;
      font-size: 20px;
    }

    .mine-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .mine-button {
      border: 1px solid var(--line);
      background: var(--surface-soft);
      color: var(--text);
      border-radius: 11px;
      padding: 16px;
      text-align: left;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
    }

    .mine-button.active {
      border-color: var(--accent);
      background: #edf5fc;
      color: var(--accent-dark);
    }

    .selected-mine {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    details {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 14px;
      overflow: hidden;
    }

    summary {
      list-style: none;
      cursor: pointer;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    summary::-webkit-details-marker { display: none; }

    summary h2 {
      margin: 3px 0 0;
      font-size: 20px;
    }

    .summary-hint {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .section-content {
      padding: 0 20px 20px;
      border-top: 1px solid var(--line);
    }

    .subheading {
      margin: 18px 0 10px;
      font-size: 13px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      font-weight: 900;
    }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .image-card {
      display: block;
      text-decoration: none;
      color: inherit;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--surface-soft);
      overflow: hidden;
    }

    .image-card img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      background: #e6ebee;
    }

    .image-card figcaption {
      padding: 9px 10px;
      font-size: 12px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .document-meta {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 650;
    }

    .pdf-list {
      display: grid;
      gap: 8px;
    }

    .pdf-link {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      text-decoration: none;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface-soft);
      font-size: 13px;
      font-weight: 800;
    }

    .pdf-icon {
      width: 28px;
      height: 34px;
      flex: 0 0 auto;
      border-radius: 4px;
      background: #c62828;
      color: white;
      display: grid;
      place-items: center;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .04em;
    }

    .empty {
      color: var(--muted);
      font-size: 13px;
      padding: 12px 0 4px;
    }

    .error {
      background: #fff0f0;
      color: #8e2525;
      border: 1px solid #e6b9b9;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 14px;
    }

    @media (max-width: 900px) {
      .image-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 650px) {
      .mine-buttons,
      .image-grid {
        grid-template-columns: 1fr;
      }

      summary {
        align-items: flex-start;
      }

      .summary-hint {
        white-space: normal;
        text-align: right;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Documentación gráfica</p>
      <h1>Planos Mina</h1>
    </div>
    <a class="back-link" href="index.html">Menú principal</a>
  </header>

  <main>
    <section class="mine-selector">
      <p class="eyebrow">Selección</p>
      <h2>Selecciona la mina</h2>

      <div class="mine-buttons">
        <button class="mine-button" type="button" data-mine="Santa Maria">
          Santa Maria
        </button>

        <button class="mine-button" type="button" data-mine="Unificación/Hallazgo">
          Unificación/Hallazgo
        </button>
      </div>
    </section>

    <p id="selectedMineText" class="selected-mine">
      Selecciona una mina para visualizar sus archivos.
    </p>

    <section id="mineContent" hidden>
      <details>
        <summary>
          <div>
            <p class="eyebrow">Planos vigentes</p>
            <h2>Topografía actualizada</h2>
          </div>
          <span class="summary-hint">Mostrar / ocultar</span>
        </summary>
        <div id="topografiaContent" class="section-content"></div>
      </details>

      <details>
        <summary>
          <div>
            <p class="eyebrow">Seguimiento</p>
            <h2>Proyectos prioritarios</h2>
          </div>
          <span class="summary-hint">Mostrar / ocultar</span>
        </summary>
        <div id="proyectosContent" class="section-content"></div>
      </details>
    </section>
  </main>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbzstqms0HqJ5wWqt8oECspm9VkqRy5i5cYrMQ3kY3rhYADVnttDVu2He9tZuCu44w7p/exec";

    let documents = [];
    let selectedMine = "";

    const mineContent = document.getElementById("mineContent");
    const selectedMineText = document.getElementById("selectedMineText");
    const topografiaContent = document.getElementById("topografiaContent");
    const proyectosContent = document.getElementById("proyectosContent");
    const mineButtons = [...document.querySelectorAll(".mine-button")];

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function normalizeText(value) {
      return String(value ?? "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function documentType(document) {
      return String(document.tipoArchivo || "").trim().toLowerCase();
    }

    function sortDocuments(items) {
      return [...items].sort((a, b) => {
        const orderA = Number(a.orden) || 0;
        const orderB = Number(b.orden) || 0;

        if (orderA !== orderB) return orderA - orderB;

        return String(a.titulo || "").localeCompare(
          String(b.titulo || ""),
          "es",
          { sensitivity: "base" }
        );
      });
    }

    function documentMeta(document) {
      const parts = [];

      if (document.version) {
        parts.push(`Versión ${document.version}`);
      }

      if (document.fechaActualizacion) {
        parts.push(document.fechaActualizacion);
      }

      return parts.length
        ? `<span class="document-meta">${escapeHtml(parts.join(" · "))}</span>`
        : "";
    }

    function renderSection(container, items) {
      const allDocuments = Array.isArray(items) ? items : [];

      const images = sortDocuments(
        allDocuments.filter(document =>
          ["jpg", "jpeg", "png", "webp"].includes(documentType(document))
        )
      );

      const pdfs = sortDocuments(
        allDocuments.filter(document => documentType(document) === "pdf")
      );

      if (!images.length && !pdfs.length) {
        container.innerHTML =
          '<p class="empty">Todavía no hay archivos registrados en esta sección.</p>';
        return;
      }

      let html = "";

      if (images.length) {
        html += '<h3 class="subheading">Imágenes</h3>';
        html += '<div class="image-grid">';

        images.forEach(document => {
          const title = document.titulo || document.idDocumento || "Plano";
          const href = document.urlVista || "#";
          const source = document.urlMiniatura || document.urlPreview || "";

          html += `
            <a class="image-card" href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">
              <figure style="margin:0">
                <img src="${escapeHtml(source)}" alt="${escapeHtml(title)}" loading="lazy" />
                <figcaption>
                  ${escapeHtml(title)}
                  ${documentMeta(document)}
                </figcaption>
              </figure>
            </a>
          `;
        });

        html += "</div>";
      }

      if (pdfs.length) {
        html += '<h3 class="subheading">PDF</h3>';
        html += '<div class="pdf-list">';

        pdfs.forEach(document => {
          const title = document.titulo || document.idDocumento || "Documento PDF";
          const href = document.urlVista || "#";

          html += `
            <a class="pdf-link" href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">
              <span class="pdf-icon" aria-hidden="true">PDF</span>
              <span>
                ${escapeHtml(title)}
                ${documentMeta(document)}
              </span>
            </a>
          `;
        });

        html += "</div>";
      }

      container.innerHTML = html;
    }

    function documentsByCategory(mine, category) {
      const normalizedMine = normalizeText(mine);
      const normalizedCategory = normalizeText(category);

      return documents.filter(document =>
        normalizeText(document.mina) === normalizedMine &&
        normalizeText(document.categoria) === normalizedCategory
      );
    }

    function selectMine(mine) {
      selectedMine = mine;

      mineButtons.forEach(button => {
        button.classList.toggle("active", button.dataset.mine === mine);
      });

      selectedMineText.textContent = `Mina seleccionada: ${mine}`;
      mineContent.hidden = false;

      renderSection(
        topografiaContent,
        documentsByCategory(mine, "Topografía actualizada")
      );

      renderSection(
        proyectosContent,
        documentsByCategory(mine, "Proyectos prioritarios")
      );
    }

    mineButtons.forEach(button => {
      button.addEventListener("click", () => {
        selectMine(button.dataset.mine);
      });
    });

    async function init() {
      try {
        selectedMineText.textContent = "Cargando catálogo de planos…";

        const response = await fetch(
          `${API_URL}?accion=documentos`,
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const result = await response.json();

        if (!result.ok) {
          throw new Error(result.mensaje || "La API devolvió un error.");
        }

        documents = Array.isArray(result.datos) ? result.datos : [];
        selectedMineText.textContent =
          "Selecciona una mina para visualizar sus archivos.";

        const params = new URLSearchParams(window.location.search);
        const mineParam = params.get("mina");

        const matchingButton = mineButtons.find(button =>
          normalizeText(button.dataset.mine) === normalizeText(mineParam)
        );

        if (matchingButton) {
          selectMine(matchingButton.dataset.mine);
        }

      } catch (error) {
        console.error(error);

        const errorBox = document.createElement("div");
        errorBox.className = "error";
        errorBox.textContent =
          "No fue posible cargar el catálogo de planos desde Google Sheets.";
        document.querySelector("main").prepend(errorBox);

        selectedMineText.textContent =
          "El catálogo no está disponible en este momento.";
      }
    }

    init();
  </script>
</body>
</html>
